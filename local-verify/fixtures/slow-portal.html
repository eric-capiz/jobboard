<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>MockSlow — Careers Portal</title></head>
<body>
<header>
  <nav>
    <a href="/index.html">Home</a>
    <a href="/about.html">About Us</a>
  </nav>
  <h1>MockSlow Careers</h1>
  <p>Find your next role with us.</p>
  <!-- A ticker that keeps growing for ~12s: the render's DOM-stability
       settles keep hitting their caps while it changes length, the
       way the live Foundever page's slow load + late cookie banner
       ate the 20s budget before the search gate ran (2026-11-12
       canary: searchOutcome skipped-time). -->
  <p id="ticker">Loading</p>
  <button id="country-toggle">Find a job in your country</button>
</header>
<div id="country-modal" role="dialog" style="display:none">
  <h2>Choose your country</h2>
  <ul id="country-list"></ul>
</div>
<script>
  var dots = 0;
  var ticker = setInterval(function () {
    dots += 1;
    document.getElementById('ticker').textContent = 'Loading' + '.'.repeat(dots);
    if (dots >= 20) clearInterval(ticker);
  }, 600);
  // Cookie banner arrives LATE (~3s, after the early settle) and is
  // a plain static div — it is not a covering overlay, so the render
  // must still dismiss it on the second pass.
  setTimeout(function () {
    var b = document.createElement('div');
    b.id = 'cookie-banner';
    b.innerHTML = '<p>We use cookies to offer you the best possible website experience. Your cookie preferences will be stored in your browser\'s local storage.</p>'
      + '<button id="accept-cookies" onclick="document.getElementById(\'cookie-banner\').style.display=\'none\'">Accept All Cookies</button>';
    document.body.appendChild(b);
  }, 3000);
  document.getElementById('country-toggle').addEventListener('click', function () {
    var list = document.getElementById('country-list');
    if (list.children.length === 0) {
      var countries = [
        ['United States (USA)', '/slow-results.html'],
        ['Canada', '/slow-results-ca.html'],
        ['Mexico', '/slow-results-mx.html']
      ];
      countries.forEach(function (c) {
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.textContent = c[0];
        a.href = c[1];
        li.appendChild(a);
        list.appendChild(li);
      });
    }
    document.getElementById('country-modal').style.display = 'block';
  });
</script>
</body>
</html>
