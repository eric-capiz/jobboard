<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>MockKelly — Find a Job</title></head>
<body>
<div id="cookie-banner">
  <p>We use cookies and other technologies to improve your experience. By continuing, you agree to our use of cookies.</p>
  <button id="accept-cookies" onclick="document.getElementById('cookie-banner').style.display='none'">Accept Cookies</button>
  <button type="button">Cookie Settings</button>
</div>
<header>
  <h1>Find a Job</h1>
</header>
<form action="/kelly.html" method="get">
  <input name="q" type="search" placeholder="Search by Keyword">
  <input name="location" type="text" placeholder="Location">
  <button type="submit">Search</button>
</form>
<div id="job-list"></div>
<script>
  // Workday-style shell: the cards only exist after the portal's own JS
  // runs, so the plain-HTML walk sees an empty shell and the render
  // must surface them.
  setTimeout(function () {
    document.getElementById('job-list').innerHTML = '<p>Results 1 – 4 of 4</p>'
      + '<div class="job-card"><a href="/job/Assembler-Grand-Rapids/4001/">Assembler</a><span class="location">Grand Rapids, MI</span></div>'
      + '<div class="job-card"><a href="/job/Forklift-Operator-Dallas/4002/">Forklift Operator</a><span class="location">Dallas, TX</span></div>'
      + '<div class="job-card"><a href="/job/Registered-Nurse-Detroit/4003/">Registered Nurse</a><span class="location">Detroit, MI</span></div>'
      + '<div class="job-card"><a href="/job/Accountant-Troy/4004/">Accountant</a><span class="location">Troy, MI</span></div>';
  }, 200);
</script>
</body>
</html>
